name: Dependency review

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  review:
    name: Review dependency changes
    # Pinned: this job only reads dependency metadata, but a moving image is still a moving
    # input to a security gate.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Blocks a PR that introduces a vulnerable package, or one whose licence would
      # conflict with WinPlay's GPL-3.0-or-later obligations (see THIRD_PARTY_NOTICES.md —
      # MS-PL, for example, is GPL-incompatible and must never be linked in).
      - name: Dependency review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate
          deny-licenses: MS-PL, GPL-2.0-only, AGPL-3.0-only, AGPL-3.0-or-later
